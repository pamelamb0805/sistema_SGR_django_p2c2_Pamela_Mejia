{# Tarjeta de acceso rápido. Uso: {% url 'app:vista' as u %}{% include "partials/_tarjeta.html" with icon="bi-people" title="Título" text="Descripción" url=u badge=3 %} #}
<div class="col-sm-6 col-xl-4">
  <a href="{{ url }}" class="card h-100 text-decoration-none sgr-tarjeta shadow-sm">
    <div class="card-body d-flex gap-3 align-items-start">
      <i class="bi {{ icon }} fs-2 text-primary" aria-hidden="true"></i>
      <div>
        <h3 class="h6 mb-1 text-body">{{ title }}{% if badge %} <span class="badge text-bg-danger">{{ badge }}</span>{% endif %}</h3>
        <p class="small text-body-secondary mb-0">{{ text }}</p>
      </div>
    </div>
  </a>
</div>
